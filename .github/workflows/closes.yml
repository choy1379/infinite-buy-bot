name: 매일 종가 저장

on:
  schedule:
    # UTC. 미국 장 마감 뒤 + 혹시 빠진 날 메우기용 한 번 더 (새 날짜만 붙으니 여러 번 돌아도 같음)
    - cron: "40 21 * * 1-5"
    - cron: "0 3 * * 2-6"
  workflow_dispatch:

permissions:
  contents: write

concurrency: closes

jobs:
  closes:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: market-data 브랜치 가져오기 (없으면 새로)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone -q --depth 1 -b market-data "$url" data || (mkdir data && git -C data init -q -b market-data && git -C data remote add origin "$url")
      - name: 새 날짜 종가 붙이기
        run: python -m laoer.closes data
      - name: 커밋
        working-directory: data
        run: |
          git add -A
          git diff --cached --quiet && exit 0
          git -c user.name=github-actions -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "closes $(date -u +%F)"
          git push -q origin market-data
