# 이 파일을 config.toml 로 복사해서 채우세요.  (config.toml 은 git에 올라가지 않습니다)
#   copy config.example.toml config.toml    (Windows)
#   cp config.example.toml config.toml      (mac/linux)

[toss]
# 토스증권 Open API 키. 비워두면 환경변수 TOSS_CLIENT_ID / TOSS_CLIENT_SECRET 를 씁니다.
client_id = ""
client_secret = ""
# 0 또는 생략 = 첫 번째 종합매매(BROKERAGE) 계좌 자동 선택
account_seq = 0

[strategy]
symbol = "TECL"
capital_usd = 10000          # 1사이클 원금(달러). 1회 매수금 = 원금 / splits
splits = 20                  # 분할 수
target_pct = 15              # 목표 수익률(%) — 보유의 3/4를 평단 x (1 + 15%) 지정가 매도
# 별% = star_base_pct - star_slope x T
# 생략하면 star_base_pct = target_pct, star_slope = 2 x target_pct / splits  → 20분할·15% 이면 15 - 1.5T
# (SOXL식으로 쓰려면 target_pct = 20 → 20 - 2T)
# star_base_pct = 15
# star_slope = 1.5
first_buy_premium_pct = 12   # 사이클 첫 매수 LOC 한도가 = 현재가 +12% (사실상 종가 매수)
extra_buy_levels = 0         # 하락 추가매수: 종가가 더 빠지면 1주씩 더 사는 LOC 단계 수 (0 = 끔)
quarter_sell = true          # 보유의 1/4 를 별지점 LOC 매도 (쿼터매도)
compound = false             # true면 사이클이 끝날 때 수익/손실을 다음 사이클 원금에 반영

[run]
# "trade" = 봇이 직접 주문 / "alert" = 주문은 안 하고 '오늘 넣을 주문'과 마감 결과만 알림 (직접 주문할 때)
mode = "trade"
dry_run = true               # true = 주문을 넣지 않고 계획만 알림. 충분히 확인한 뒤 false 로!
order_offset_minutes = 15    # 정규장 시작 후 N분에 주문
order_cutoff_minutes = 20    # 정규장 마감 N분 전부터는 새로 주문하지 않음 (LOC 접수 마감 대비)
report_offset_minutes = 20   # 정규장 마감 후 N분에 체결 결과 알림
report_not_before_kst = ""   # 예: "07:30" — 체결 알림을 한국시간 이 시각 이후에 보냄 (새벽 알림 방지)
skip_if_open_orders = true   # 같은 종목 미체결 주문(수동 주문 등)이 있으면 그날 봇 주문을 건너뜀
state_dir = "state"          # 상태/토큰/로그 저장 폴더

[notify.discord]
# 디스코드 채널 설정 > 연동 > 웹후크 > URL 복사. 비워두면 환경변수 DISCORD_WEBHOOK_URL
webhook_url = ""
username = "TECL 무매봇"

[notify.kakao]
# developers.kakao.com 내 애플리케이션 > 앱 키 > REST API 키. 비워두면 카톡 알림 끔
rest_api_key = ""
client_secret = ""                   # 보안 > Client Secret 을 '사용함'으로 했다면 입력
redirect_uri = "https://localhost"   # 카카오 로그인 > Redirect URI 에 등록한 값과 똑같이
link_url = "https://tossinvest.com"  # 메시지 버튼 링크 (앱 > 플랫폼 > Web 사이트 도메인에 등록)

[dashboard]
# 모니터링 페이지 (https://choy1379.github.io/infinite-buy-bot/). 비워두면 끔.
# GitHub > Settings > Developer settings > Fine-grained tokens 에서
#   Repository access: infinite-buy-bot 만 / Permissions: Contents = Read and write
# 비워두면 환경변수 TECL_DASHBOARD_TOKEN
github_token = ""
# 금액 정보를 잠그는 비밀번호 (8자 이상, 다른 곳에서 안 쓰는 것). 비워두면 환경변수 TECL_DASHBOARD_PASSWORD
password = ""
repo = "choy1379/infinite-buy-bot"
branch = "tecl-data"         # 데이터만 올라가는 브랜치 (없으면 봇이 만듦)
heartbeat_minutes = 180      # 할 일이 없어도 이 간격으로 '봇 살아있음' 갱신

[live]
# 실시간 호가 페이지: 봇이 돌 때 이 PC에서 http://localhost:8765/ 로 열림.
# 같은 와이파이의 폰에서는 http://<이 PC의 IP>:8765/ (처음에 Windows 방화벽 허용 창이 뜨면 '개인 네트워크' 허용)
# 0 = 끔. host = "127.0.0.1" 이면 이 PC에서만 열림
port = 8765
host = "0.0.0.0"
